name: Release theme

# Publishes a GitHub release when a version tag is pushed, or on manual
# dispatch (Actions → Release theme → Run workflow), which creates the tag
# from the version in manifest.json at the chosen branch.
# Obsidian installs and updates themes from the release whose tag matches
# the version in manifest.json, so the tag must be the bare version number
# (e.g. 1.0.0 — no "v" prefix) and must agree with the manifest.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version from tag or manifest
        run: |
          MANIFEST_VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [ "$MANIFEST_VERSION" != "$TAG" ]; then
              echo "::error::Tag $TAG does not match manifest.json version $MANIFEST_VERSION" >&2
              exit 1
            fi
          else
            TAG="$MANIFEST_VERSION"
          fi
          echo "tag=$TAG manifest=$MANIFEST_VERSION"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create GitHub release with theme assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" manifest.json theme.css \
            --title "Newspaper $TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes
